services:
  db:
    image: postgres:16
    container_name: poolup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poolup}
      POSTGRES_USER: ${POSTGRES_USER:-poolup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolup}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
