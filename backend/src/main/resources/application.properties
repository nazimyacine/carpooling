spring.application.name=poolup

# Base de données : valeurs par défaut = docker-compose.yml, surchargeables par variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poolup}
spring.datasource.username=${DB_USER:poolup}
spring.datasource.password=${DB_PASSWORD:poolup}

# Le schéma est géré uniquement par Flyway (src/main/resources/db/migration) ;
# Hibernate vérifie juste que les entités correspondent aux tables, sans jamais les modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Les données de démo (profil demo) sont une migration répétable : sans ce profil, Flyway
# ne doit pas refuser de démarrer sur une base où elles ont déjà été chargées
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Dates stockées et échangées en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT : clé de signature HMAC-SHA256 (au moins 32 caractères) et durée de validité du jeton.
# La valeur par défaut ne sert qu'en développement : définir JWT_SECRET partout ailleurs.
poolup.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-poolup-0123456789}
poolup.jwt.expiration=${JWT_EXPIRATION:24h}
